<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CryptoForge</title>
    <meta
      name="description"
      content="A secure and scalable platform for cryptocurrency mining investments, allowing users to invest in various mining plans, track profits in real-time, manage funds, and earn referral bonuses."
    />
    <meta name="theme-color" content="#020617" />
    <script>
      // Applied before first paint so a light-theme user never sees a dark flash.
      // Must stay in sync with THEME_KEY in src/lib/theme.jsx.
      (function () {
        try {
          var t = localStorage.getItem('cryptoforge.theme')
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
